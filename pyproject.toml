[project]
name = "wizards-castle"
version = "1.0.0"
description = "Reinterpretación 2026 del Wizard's Castle de Joseph R. Power (1980)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "davidvivo-ia" }]
keywords = ["roguelike", "retro", "1980", "basic", "textual", "tui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Typing :: Typed",
]
dependencies = [
    "textual>=0.86",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "structlog>=24.1",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "textual-dev>=1.5",
]

[project.scripts]
wizards-castle = "wizards_castle.presentation.cli:app"

[project.urls]
Homepage = "https://github.com/davidvivo-ia/wizard-s-castle-python"
"Decoded original" = "http://maizure.org/projects/decoded-the-wizards-castle/index.html"
"IF Archive" = "https://www.ifarchive.org/indexes/if-archive/games/source/basic/"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wizards_castle"]

[tool.hatch.build.targets.wheel.shared-data]
"src/wizards_castle/assets" = "wizards_castle/assets"

# ─── Ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "N",          # pep8-naming
    "UP",         # pyupgrade
    "B",          # flake8-bugbear
    "C4",         # flake8-comprehensions
    "SIM",        # flake8-simplify
    "RUF",        # ruff-specific
    "PL",         # pylint subset
    "PT",         # flake8-pytest-style
    "TID",        # flake8-tidy-imports
    "ANN",        # flake8-annotations
]
ignore = [
    "E501",       # line length handled by formatter
    "ANN401",     # allow Any in narrow places
    "PLR0913",    # ok to take many args in dataclasses
    "PLR2004",    # magic numbers in domain are unavoidable (HP, damage tables)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101", "PT011"]
"src/wizards_castle/__main__.py" = ["T201"]
"run.py" = ["PLC0415", "T201", "S603", "S607"]  # lazy bootstrap launcher

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ─── Mypy ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = ["textual.*", "structlog.*"]
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["src/wizards_castle"]
branch = true
omit = ["src/wizards_castle/presentation/tui.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
show_missing = true
skip_covered = false
